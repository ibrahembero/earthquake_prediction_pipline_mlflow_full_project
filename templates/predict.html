{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    <title>Predict</title>
    <style>
        .main{
            position:fixed;
            top:120px;
            left:410px;
            width:700px;
            background-color:gainsboro;
            align-items:center;
            border-radius:5%;
        }
        div{
            padding:15px;
        }
        input[type=submit]{
            background-color:Black;
            color:white;
            cursor:pointer;
            padding: 16px 32px;
        }
        h1{
            font-size:40px;
        }
        h2{
            font-size:30px;
            color:DarkRed;
        }
        body{
            background-image: url("{% static "earthquake2.jpg" %}"); 
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
            
        }
    </style>
</head>
<body style="text-align: center;">
    <div class="main">
        <h1>Please Enter The Following Values</h1>
        <form action="result">
            <div class="row">
                <div class="col-sm-4" style="background-color: bisque;">
                    <p>Longitude</p>
                    <input type="text" name="longitude">
                </div>
                <div class="col-sm-4" style="background-color: darkseagreen;">
                    <p>Latitude</p>
                    <input type="text" name="latitude">
                </div>
            </div>
            <div class="row">
                <div class="col-sm-4" style="background-color: lightpink;">
                    <p>Depth</p>
                    <input type="text" name="depth">
                </div>
                <div class="col-sm-4" style="background-color: turquoise;">
                    <p>Timestamp</p>
                    <input type="text" name="timestamp">
                </div>
            </div>
            <div class="row">
                <input type="submit" value="PREDICT">
            </div>
        </form>
        <div class="row">
            {% comment %} <h2>{{magnitude}}</h2> {% endcomment %}
        </div>
    </div>
    
</body>
</html>
